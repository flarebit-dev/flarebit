<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flarebit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="notification" class="hidden">
            <div class="notification-glow"></div>
            <div class="notification-inner">
                <div class="notification-icon">
                    <div class="dot-outer">
                        <div class="dot-inner"></div>
                    </div>
                </div>
                <div class="notification-content">
                    <div class="notification-title">Flarebit is alive</div>
                    <div class="notification-subtitle">System online and operational.</div>
                </div>
                <div class="notification-meta">
                    <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                    <span class="meta-time">now</span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
